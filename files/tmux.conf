# .tmux.conf

# Use the user's own login shell for new panes, instead of tmux's default.
set -g default-command "${SHELL}"

# Keep 500k lines of scrollback per pane instead of tmux's default (2000).
set -g history-limit 500000

# Status bar: short hostname (no domain) + current date/time
set -g status-right "#h • %Y-%m-%d %H:%M"

# Prefer "tmux-256color", but old macOS ncurses lacks that terminfo entry
# (breaks Backspace etc.) unless fixed locally via tic. Check if it
# actually resolves and fall back to "screen-256color" if not — same file
# works on Debian and on a fixed Mac unmodified. Absolute /usr/bin/infocmp
# avoids Anaconda's $PATH-shadowed infocmp giving a false positive.
if-shell '/usr/bin/infocmp tmux-256color >/dev/null 2>&1' \
  'set -s default-terminal "tmux-256color"' \
  'set -s default-terminal "screen-256color"'

# Let programs write raw escape sequences straight through to the outer
# terminal (DCS passthrough) — off by default since tmux 3.3. Needed by
# agent-notify's TTS renderer to reach iTerm2's listener.
set-option -g allow-passthrough on

# Time (ms) tmux waits after seeing ESC before deciding it's a lone
# Escape key vs. the start of a longer escape sequence. Default (500ms)
# causes a noticeable lag on Escape in vim/neovim; 0 makes it instant.
set -s escape-time 0

# Preserve modifier information for keys such as Shift+Enter. In the legacy
# terminal protocol, Enter and Shift+Enter both arrive as CR (`0d`), so an
# application cannot distinguish them. `extended-keys on` lets tmux retain
# and forward the Shift modifier; without it, Shift+Enter fails in Claude.
#
# tmux can encode the same Shift+Enter event in two extended-key formats:
#   xterm: `ESC[27;2;13~` = `1b 5b 32 37 3b 32 3b 31 33 7e`
#   CSI-u: `ESC[13;2u`    = `1b 5b 31 33 3b 32 75`
# (`2` means Shift and `13` means Enter in both.) tmux defaults to `xterm`,
# which works with Claude but is misread as submit by Codex CLI 0.150.1.
# CSI-u works with both Claude and Codex, so select it explicitly.
#
# `terminal-features ... extkeys` tells tmux that the outer xterm-compatible
# terminal (for example iTerm2) can report extended keys in the first place.
# Why Shift+Enter fails in Claude over plain SSH without tmux, and the probe
# that measures all this: ~/dev/my-setup/doc/shift_enter_over_ssh.md
set -s extended-keys on
set -s extended-keys-format csi-u
# A fixed index, not `set -as` (append): every reload appended one more copy
# (185 on 4 Nov 2026).
set -s terminal-features[50] 'xterm*:extkeys'

# No hyperlinks to iTerm2 (user, 4 Nov 2026): tmux detects iTerm2 and passes
# on the hidden-link codes (OSC 8) that Claude Code puts on every URL and file
# path; iTerm2 opens such a link at once, in Chrome's most recent window on any
# desktop, skipping its own click rules (Semantic History, Smart Selection),
# which send clicks to `agent-chrome show --clicked` (skill chrome): the page
# then opens on the desktop of the terminal clicked in. Without the codes,
# links arrive as plain text and those rules apply. Cost: a link shown only as
# a label (its address hidden) is no longer clickable.
set -s terminal-overrides[50] '*:Hls@'

# Enable mouse mode: click to select/focus a pane, scroll to view
# scrollback, drag a pane border to resize.
set -g mouse on

# By default, releasing the mouse button after dragging a text selection
# in copy-mode exits copy-mode immediately. This keeps you in copy-mode
# with the selection intact, so you can still act on it (e.g. copy).
unbind -T copy-mode-vi MouseDragEnd1Pane

# Use vi-style keys (hjkl, etc.) to navigate in copy-mode, instead of
# tmux's default emacs-style bindings.
setw -g mode-keys vi

# New windows (prefix + c) and splits (prefix + " / %) open in the current
# pane's directory, instead of the directory the session was started in.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Show a one-line status bar at the TOP of each pane (index + title).
# It is the bar "━━  0: <hostname>  ━━━━━━━━━━━━━━━" on top of each pane
# Useful to display the title of each Claude Sessions, for example
set -g pane-border-status top

# Format of that per-pane status line: colors the border based on a
# custom per-pane variable (@pane_color, cycled via "prefix + b" below —
# gold/green/blue/default), then shows " <pane-index>: <pane-title> ".
set -g pane-border-format " #{?#{==:#{@pane_color},gold},#[fg=white]#[bg=#8a7e3b]#[bold],#{?#{==:#{@pane_color},green},#[fg=white]#[bg=#1e6e1e]#[bold],#{?#{==:#{@pane_color},blue},#[fg=white]#[bg=#1a3a6b]#[bold],#[fg=white]#[bg=black]#[bold]}}} #P: #T #[default] "

# Draw pane split borders with thicker line characters, easier to see.
set -g pane-border-lines heavy

# Dim inactive panes (grey text on dark grey background)...
set -g window-style 'fg=colour240,bg=colour236'

# ...and make the active pane pop (bright white text on pure black), so
# it's obvious at a glance which pane currently has focus.
set -g window-active-style 'fg=colour255,bg=black'

# "prefix + b": cycle the current pane's background tint through
# none -> gold -> green -> blue -> none, by storing the current index in
# a pane-local variable (@bg_color_idx) and setting window-style /
# window-active-style to match. A manual, per-pane way to color-code
# panes — separate from (and older than) agent-notify's own
# automatic tmux-pane-bg renderer, which does something similar but
# driven by CLAUDE_STATUS instead of a manual keybinding.
bind b run-shell '\
  idx=$(tmux show -pv @bg_color_idx 2>/dev/null || echo 0); \
  idx=$(( (idx + 1) % 4 )); \
  tmux set -p @bg_color_idx $idx; \
  case $idx in \
    0) tmux set -pu @pane_color; \
       tmux set-option -pu window-style; \
       tmux set-option -pu window-active-style ;; \
    1) tmux set -p @pane_color gold; \
       tmux set-option -p window-style "fg=colour240,bg=#28261f"; \
       tmux set-option -p window-active-style "fg=colour255,bg=#1f1c0d" ;; \
    2) tmux set -p @pane_color green; \
       tmux set-option -p window-style "fg=colour240,bg=#1c281c"; \
       tmux set-option -p window-active-style "fg=colour255,bg=#081f08" ;; \
    3) tmux set -p @pane_color blue; \
       tmux set-option -p window-style "fg=colour240,bg=#1c2028"; \
       tmux set-option -p window-active-style "fg=colour255,bg=#070f1f" ;; \
  esac'

# NOTE: no AGENT-NOTIFY block below this line, deliberately. notify owns
# that block itself - `notify init` injects it (guarded by its own
# "# ┌─ AGENT-NOTIFY BLOCK" markers). bootstrap.sh calls it right after
# deploying this file, and modules/tools.sh after installing notify.
# Baking it in here would mean this file ships hooks for a tool that might
# not even be installed - which is exactly the bug that shipped it,
# uninstalled, to a machine that never had `notify init` run on it.
